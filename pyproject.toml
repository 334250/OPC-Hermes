[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opc-hermes"
version = "0.1.0"
description = "OPC-Hermes: Multi-agent management layer built on Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OPC-Hermes Architecture Team" }]
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
chromadb = ["chromadb>=0.4.0,<0.7"]
dev = ["pytest>=9.0,<10"]

[tool.setuptools.packages.find]
include = ["opc_hermes", "opc_hermes.*"]
exclude = ["hermes-agent", "hermes-agent.*"]

[tool.setuptools.package-data]
opc_hermes = [
    "agent_list/defaults.yaml",
    "config/leader_default.yaml",
    "config/worker_templates/prompts.yaml",
    "skills/opc-data-analyst.md",
    "skills/opc-evaluator.md",
    "skills/opc-illustrator.md",
    "skills/opc-leader.md",
    "skills/opc-ppt-maker.md",
    "skills/opc-researcher.md",
    "skills/opc-reviewer.md",
    "skills/opc-writer.md",
]

[tool.pytest.ini_options]
testpaths = ["opc_hermes/tests"]
pythonpath = ["."]
addopts = "-ra"
